appId: host.exp.Exponent
---
- runFlow:
    file: 02-auth-login-success.yaml
    env:
      E2E_APP_ID: ${E2E_APP_ID}
      E2E_EXPO_URL: ${E2E_EXPO_URL}
      MEMBER_EMAIL: ${MEMBER_EMAIL}
      MEMBER_PASSWORD: ${MEMBER_PASSWORD}
- tapOn:
    id: "header-profile"
    optional: true
- tapOn:
    text: "Profile"
    optional: true
- extendedWaitUntil:
    visible:
      text: "Profile"
    timeout: 20000
    optional: true
- takeScreenshot: profile-screen
