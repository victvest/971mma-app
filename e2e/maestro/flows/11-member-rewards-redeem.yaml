appId: host.exp.Exponent
---
- runFlow:
    file: 02-auth-login-success.yaml
    env:
      E2E_APP_ID: ${E2E_APP_ID}
      E2E_EXPO_URL: ${E2E_EXPO_URL}
      MEMBER_EMAIL: ${MEMBER_EMAIL}
      MEMBER_PASSWORD: ${MEMBER_PASSWORD}
- tapOn: "Open navigation menu"
- tapOn: "Rewards"
- extendedWaitUntil:
    visible:
      text: "Rewards Catalog"
    timeout: 20000
- takeScreenshot: member-rewards-catalog
- assertVisible:
    text: "Points activity"
- assertVisible:
    text: "Redemption history"
- takeScreenshot: member-rewards-full
