appId: host.exp.Exponent
---
# Best-case camera scenario: simulator camera hardware can't decode a real QR code,
# so this flow proves everything UP TO the physical scan — permission grant, scanner
# screen mount, no crash — and stops there. The decode-and-checkin logic itself is
# covered against the live backend in tests/mobile-app/gate-entry (entry-checkin RPC).
- runFlow:
    file: 02-auth-login-success.yaml
    env:
      E2E_APP_ID: ${E2E_APP_ID}
      E2E_EXPO_URL: ${E2E_EXPO_URL}
      MEMBER_EMAIL: ${MEMBER_EMAIL}
      MEMBER_PASSWORD: ${MEMBER_PASSWORD}
- tapOn: "Check-in"
- extendedWaitUntil:
    visible:
      text: "Check-in"
    timeout: 20000
- tapOn:
    text: "Scan"
    optional: true
- extendedWaitUntil:
    visible:
      text: "Camera access is needed to scan the entrance QR code."
    timeout: 8000
    optional: true
- takeScreenshot: member-scan-permission-prompt
- tapOn:
    text: "Enable camera"
    optional: true
- tapOn:
    text: "OK"
    optional: true
- tapOn:
    text: "Allow"
    optional: true
- extendedWaitUntil:
    notVisible:
      text: "Camera access is needed to scan the entrance QR code."
    timeout: 10000
    optional: true
- takeScreenshot: member-scan-screen-active
