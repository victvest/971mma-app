appId: host.exp.Exponent
---
- runFlow:
    file: 02-auth-login-success.yaml
    env:
      E2E_APP_ID: ${E2E_APP_ID}
      E2E_EXPO_URL: ${E2E_EXPO_URL}
      MEMBER_EMAIL: ${MEMBER_EMAIL}
      MEMBER_PASSWORD: ${MEMBER_PASSWORD}
- tapOn: "Schedule"
- extendedWaitUntil:
    visible:
      text: "Schedule"
    timeout: 20000
- takeScreenshot: schedule-tab
- scroll
- takeScreenshot: schedule-scrolled
