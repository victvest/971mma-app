appId: host.exp.Exponent
---
- runFlow:
    file: ../subflows/launch-app.yaml
    env:
      E2E_APP_ID: ${E2E_APP_ID}
      E2E_EXPO_URL: ${E2E_EXPO_URL}
- tapOn:
    id: "auth-intro-sign-in"
- extendedWaitUntil:
    visible: "Forgot password?"
    timeout: 10000
- tapOn: "Forgot password?"
- extendedWaitUntil:
    visible:
      text: "Reset"
    timeout: 15000
    optional: true
- takeScreenshot: forgot-password-screen
