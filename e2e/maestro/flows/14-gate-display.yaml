appId: host.exp.Exponent
---
# Gate-role login routes straight to the entrance QR display (no tabs) per
# getDefaultHomeRoute(). Verifies the rotating gate QR renders for the front desk.
- runFlow:
    file: ../subflows/launch-app.yaml
    env:
      E2E_APP_ID: ${E2E_APP_ID}
      E2E_EXPO_URL: ${E2E_EXPO_URL}
- tapOn:
    id: "auth-intro-sign-in"
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 15000
- tapOn:
    id: "auth-login-email"
- inputText: ${GATE_EMAIL}
- tapOn:
    id: "auth-login-password"
- inputText: ${GATE_PASSWORD}
- hideKeyboard
- tapOn:
    id: "auth-login-submit"
- extendedWaitUntil:
    visible:
      accessibilityHint: "Staff: hold for three seconds to exit gate mode"
    timeout: 30000
- takeScreenshot: gate-display-active
